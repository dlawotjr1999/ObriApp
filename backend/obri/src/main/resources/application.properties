spring.application.name=obri

# DB 연결
spring.datasource.url=jdbc:mysql://localhost:3307/obri?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Firebase
spring.cloud.gcp.credentials.location=classpath:firebase-service-account.json
spring.application.name=obri

# 로컬 실값 주입: application-local.properties(gitignore 대상). 없으면 무시(CI/운영은 환경변수 사용)
spring.config.import=optional:classpath:application-local.properties

# DB 연결 — 실값은 환경변수 또는 application-local.properties로 주입. 비밀번호는 기본값 없음(누락 시 부팅 실패로 조기 감지)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/obri?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — 기본은 스키마를 손대지 않는 validate. 로컬 편의(create)는 application-local.properties에서만 오버라이드 (BACKLOG.md #7)
# CI는 워크플로우에서 SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop을 환경변수로 직접 오버라이드하므로 이 기본값과 무관
spring.jpa.hibernate.ddl-auto=validate
# 기본값(운영)은 false — 바인딩 파라미터로 개인정보(전화번호·이메일)가 로그에 남는 것을 방지(BACKLOG.md #26)
# 로컬 편의는 application-local.properties에서만 오버라이드
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Firebase
spring.cloud.gcp.credentials.location=classpath:firebase-service-account.json
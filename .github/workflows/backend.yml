# ── 워크플로우 이름 ────────────────────────────────────────────
name: Backend CI

# ── 트리거 설정 ────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - "feture/**" # feature 브랜치도 포함
    paths:
      - "backend/**" # backend 폴더 변경 시에만 실행
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

# ── 잡 정의 ───────────────────────────────────────────────────
jobs:
  test:
    runs-on: ubuntu-latest

    # ── 테스트용 MySQL 컨테이너 ─────────────────────────────
    # 통합 테스트에서 실제 DB가 필요할 때 사용
    # (Testcontainers를 쓰면 이 부분은 제거 가능)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: obri_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # 1. 코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # 3. Gradle 캐시 (의존성 재사용으로 속도 향상)
      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Firebase 서비스 계정 키 생성
      # 단위 테스트는 Mock 처리라 불필요하지만,
      # 서버 컨텍스트 로드 시 FirebaseConfig가 키 파일을 찾으므로 필요
      - name: Firebase 서비스 계정 키 생성
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' \
          > backend/src/main/resources/firebase-service-account.json

      # 5. Gradle 실행 권한 부여
      - name: Gradle 실행 권한 부여
        run: chmod +x backend/gradlew

      # 6. 테스트 실행
      # ./gradlew test는 src/test/ 안의 모든 테스트를 실행
      - name: 테스트 실행
        working-directory: backend
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/obri_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

      # 7. 테스트 결과 리포트 업로드 (실패 시에만)
      - name: 테스트 결과 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/
          retention-days: 7
